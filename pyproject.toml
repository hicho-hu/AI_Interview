[project]
name = "ai-interview-backend"
version = "1.0.0"
description = "岗位定制化 AI 模拟面试后端"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.121,<0.129", "uvicorn[standard]>=0.30,<0.40",
  "pydantic>=2.7,<3", "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.13,<1.17",
  "PyMySQL[rsa]>=1.1,<2", "redis>=5,<8", "celery>=5.4,<5.7",
  "boto3>=1.35,<2", "cryptography>=44,<47", "PyJWT>=2.9,<3",
  "httpx>=0.27,<0.29", "dashscope>=1.27.5,<2", "pypdf>=5,<7", "python-docx>=1.1,<2",
  "python-dotenv>=1,<2",
  "oss2>=2.19,<3", "aliyun-python-sdk-core>=2.16,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.11,<1", "mypy>=1.13,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py39"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
follow_imports = "silent"
files = ["app/core", "app/schemas", "app/providers"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
